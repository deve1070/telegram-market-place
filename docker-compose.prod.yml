# Production stack: Caddy (HTTPS) -> bot (webhook) -> Postgres/Redis, plus a daily backup job.
# Only ports 80/443 are exposed; the database and Redis are reachable only from inside this stack.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" } # logs rotate, so they can never fill the disk

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: market
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # keep FSM state (checkout, payment proofs) across restarts
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    logging: *logging

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://market:${POSTGRES_PASSWORD}@db:5432/market
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # holds the HTTPS certificates: keep this volume
      - caddy_config:/config
    depends_on: [bot]
    logging: *logging

  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: market
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: market
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups # plain folder on the server so you can copy it off-site
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
